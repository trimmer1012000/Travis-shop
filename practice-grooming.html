<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Paws Grooming — practice page</title>
  <style>
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent2: #a7f3d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 20px;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    h1 {
      font-size: 2rem;
      line-height: 1.15;
      margin: 0 0 0.75rem;
    }
    h2 {
      font-size: 1.35rem;
      margin: 1.5rem 0 0.4rem;
    }
    p, li { color: var(--muted); font-size: 1.1rem; }
    .tag {
      display: inline-block;
      background: #334155;
      color: var(--accent2);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    ul { padding-left: 1.2rem; margin: 0.5rem 0 0; }
    li { margin: 0.45rem 0; }
    .note {
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .reach {
      color: var(--text);
      font-weight: 700;
      margin: 0.75rem 0;
      overflow-wrap: anywhere;
    }
    .reach a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">Practice only. Not a real company.</div>
    <h1>Sample Paws Grooming</h1>
    <p>They wash, trim, and tidy dogs.</p>
    <h2>Sample services</h2>
    <ul>
      <li>Bath — $35</li>
      <li>Haircut — $55</li>
      <li>Nail trim — $15</li>
    </ul>
    <p class="note">Sample prices. Not a real company.</p>
    <p class="reach"><a href="tel:+19205550185">(920)&nbsp;555&#8209;0185</a></p>
    <p class="reach"><a href="mailto:sample-paws@example.com">sample-paws@example.com</a></p>
    <footer>Practice only. Not a real company.</footer>
  </main>
</body>
</html>
